name: CI

on:
  push:
  pull_request:

jobs:
  payload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm: el pnpm-lock.yaml fija las dependencias del fork (el package-lock.json de upstream está desactualizado).
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build:payload
      - run: pnpm run smoke
      - run: bash -n scripts/package-mac.sh && bash -n scripts/brand-mac-app.sh && bash -n native/build.sh && node --check scripts/package-win.mjs && node --check scripts/build-win-helper.mjs
